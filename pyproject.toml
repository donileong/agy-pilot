[project]
name = "agy-pilot"
version = "0.1.0"
description = "Unofficial headless remote bridge and companion daemon for Google Antigravity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Doni Leong", email = "doni.leong@gmail.com" },
]
keywords = [
    "antigravity",
    "telegram",
    "ai-agent",
    "remote-control",
    "coding-agent",
    "bot",
    "im-bridge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "aiogram>=3.17.0",
    "aiosqlite>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/donileong/agy-pilot"
Repository = "https://github.com/donileong/agy-pilot.git"
Issues = "https://github.com/donileong/agy-pilot/issues"
Documentation = "https://github.com/donileong/agy-pilot#readme"

[project.scripts]
agy-pilot = "agy_pilot.cli:main"
agypilot = "agy_pilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_pilot"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
